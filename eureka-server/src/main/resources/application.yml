server:
  port: 8761  # Port standard pour Eureka Server

eureka:
  client:
    register-with-eureka: false  # Ne pas s'enregistrer aupres de lui-meme
    fetch-registry: false        # Ne pas recuperer le registre des services

logging:
  level:
    com.netflix.eureka: OFF      # Reduire les logs verbeux d'Eureka
    com.netflix.discovery: OFF   # Reduire les logs verbeux de Discovery
